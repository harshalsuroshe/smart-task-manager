spring.application.name=backend

# MySQL database connection details
spring.datasource.url=jdbc:mysql://localhost:3306/taskflow_db
spring.datasource.username=root

# spring.datasource.password=harsh2004
# Read the password from an environment variable; never store it here
spring.datasource.password=${DB_PASSWORD}

# Use the MySQL JDBC driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Show DEBUG and higher-level logs for our application code
logging.level.com.taskmanager.backend=DEBUG

# Show INFO and higher-level logs for Spring's own code
logging.level.org.springframework=INFO

# Include timestamps, log levels, and class names in console logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# Configure HikariCP's reusable connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JWT authentication configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
